name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation fonts-freefont-ttf
      - name: cargo check
        run: cargo check --workspace --all-targets
      # TEMPORARY: tracing a cross-thread event-loop wake-up hang only observed on real macOS
      # CI (see crates/qtrs-core/src/event_loop/dispatcher_cocoa.rs). Single-threaded so the
      # trace log stays readable; remove QTRS_TRACE_COCOA_DISPATCHER/--test-threads once found.
      # Scoped to the one known-hanging test binary so the trace log shows up in seconds
      # instead of after the rest of the (unrelated, already-green) workspace suite runs.
      - name: cargo test (diagnostic, layered_tests only)
        if: runner.os == 'macOS'
        env:
          QTRS_TRACE_COCOA_DISPATCHER: "1"
        run: cargo test -p qtrs-core --test layered_tests -- --test-threads=1 --nocapture
      - name: cargo test
        if: runner.os != 'macOS'
        run: cargo test --workspace --no-fail-fast
      # render tests overwrite committed PNG fixtures under qtrs-gui/target/
      # on every run; confirm nothing else drifted before calling it clean.
      - name: verify only known test-output fixtures changed
        if: runner.os == 'Linux'
        run: |
          git checkout -- crates/qtrs-gui/target/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after tests:"
            git status --porcelain
            exit 1
          fi
